name: Deploy to EC2

on:
  push:
    branches:
      - main  # Or your deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      run: docker build -t myapp-image .

    - name: Save Docker image as archive
      run: docker save myapp-image | gzip > myapp-image.tar.gz

    - name: Copy Docker image to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "myapp-image.tar.gz"
        target: "~/"

    - name: SSH into EC2 and run container
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker load < ~/myapp-image.tar.gz
          docker stop myapp || true
          docker rm myapp || true
          docker run -d --name myapp -p 80:80 myapp-image
