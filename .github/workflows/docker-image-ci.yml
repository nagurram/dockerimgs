name: Build, Publish, and Save Docker Image

on:
  push:
    branches:
      - development # Trigger the workflow on pushes to the 'development' branch
  pull_request:
    branches:
      - development # Trigger the workflow on pull requests to the 'development' branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USER }} # Docker Hub username stored in GitHub Secrets
          password: ${{ secrets.DOCKERHUB_USERKEY }} # Docker Hub password stored in GitHub Secrets

      # Step 3: Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USER }}/multi-app-nginx:latest -f Dockerfile .

      # Step 4: Push the Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/multi-app-nginx:latest

      # Step 5: Save Docker image as a .tar file
      - name: Save Docker image
        run: |
          docker save ${{ secrets.DOCKERHUB_USER }}/multi-app-nginx:latest -o multi-app-nginx.tar

      # Step 6: Upload the .tar file as an artifact
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-app-nginx-image
          path: multi-app-nginx.tar